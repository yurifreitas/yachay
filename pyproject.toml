[project]
name = "sieve"
version = "0.1.0"
description = "Turn a large, noisy, confounded screen into a defensible shortlist for expensive validation."
readme = "README.md"
requires-python = ">=3.10"
# scipy and statsmodels became real dependencies with tools/multiplicity.py. They were on the
# machine long before that and the project hand-rolled its statistics anyway, which for a
# library about statistical care was the wrong kind of self-reliance.
# networkx has been a real dependency since tools/interactome_sparse.py - it produces the
# modularity this site publishes - and was never declared. igraph, leidenalg and scikit-learn
# arrived with tools/community_stability.py, which holds that partition to a null and an
# interval: Leiden for the connectivity guarantee Louvain lacks, and sklearn for an adjusted
# Rand index. Hand-rolling either to preserve a stdlib streak would be the same mistake the
# comment above records for scipy.
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "statsmodels>=0.14",
    "networkx>=3.0", "scikit-learn>=1.4", "python-igraph>=0.11", "leidenalg>=0.10",
    # tools/gene_embedding.py. Not to draw a UMAP — to AUDIT one: trustworthiness, neighbour
    # agreement across seeds, and clustering the embedding against clustering the data it came
    # from. The figure is everywhere in biology and the three numbers under it are nowhere.
    "umap-learn>=0.5", "hdbscan>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
parquet = ["pyarrow>=14"]

[project.scripts]
sieve = "sieve.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
